spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# Tests create the schema from entities (ddl-auto=create-drop) so Flyway
# migrations are not needed. Disable Flyway to skip the PostgreSQL-only
# syntax (CREATE INDEX IF NOT EXISTS, DO $$ blocks, NUMERIC(18,4) USING
# quantity::NUMERIC) that H2 does not understand.
spring.flyway.enabled=false
app.jwt.secret=c2VjcmV0a2V5MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODk=
app.jwt.expiration-ms=3600000
jwt.cookie.name=visco_auth_token
jwt.cookie.secure=false
jwt.expiration.hours=24
spring.mail.username=test@test.com
report.recipients=test@test.com
spring.cache.type=none
cloudinary.url=cloudinary://fake:fake@fake
resend.api.key=fake
