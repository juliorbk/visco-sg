spring.application.name=viscosg
server.port=8080
# Datasource
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=7
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.data-source-properties.stringtype=unspecified

# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Cookie
jwt.cookie.name=${JWT_COOKIE_NAME:visco_auth_token}
jwt.cookie.secure=${JWT_COOKIE_SECURE:true}
spring.flyway.enabled=false
# Spring Mail (SMTP) — Replaced by Resend API
# Kept for reference; safe to remove once Resend is verified in production.
# spring.mail.host=${MAIL_HOST:smtp.gmail.com}
# spring.mail.port=${MAIL_PORT:465}
# spring.mail.username=${MAIL_USERNAME}
# spring.mail.password=${MAIL_PASSWORD}
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.ssl.enable=true
# spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}

# Sender identity used by EmailService
app.mail.from=${APP_MAIL_FROM:Visco Orinoco <noreply@viscorinoco.com>}

# Password reset
app.password-reset.base-url=${PASSWORD_RESET_BASE_URL:https://viscoorinocosia.vercel.app}
app.password-reset.token-validity-hours=${PASSWORD_RESET_VALIDITY_HOURS:2}

# Multipart
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}


# Cache (requiere caffeine dependency: pom.xml → spring-boot-starter-cache + caffeine)
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=5m

# Server
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=5
server.tomcat.accept-count=20
server.tomcat.max-connections=200

# CORS (separadas por comas)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://viscoorinocosia.vercel.app}

# Reports configuration
app.reports.storage-path=${REPORTS_STORAGE_PATH:/var/app/reports}
app.reports.max-file-size=${REPORTS_MAX_FILE_SIZE:104857600}
app.reports.cleanup-days=${REPORTS_CLEANUP_DAYS:30}
app.reports.max-records-per-export=${REPORTS_MAX_RECORDS:2000}

#Reports receivers
report.recipients=${REPORT_RECIPIENTS:}

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true

# Resend API — primary email transport (HTTPS, works on Render free tier)
resend.api.key=${RESEND_API_KEY:}
# Toggle email sending (set to true once domain is verified in Resend)
app.email.enabled=${APP_EMAIL_ENABLED:false}

# Cloudinary — profile picture uploads
cloudinary.url=${CLOUDINARY_URL:}

# Invite token validity (hours)
app.invite.default-validity-hours=${INVITE_DEFAULT_VALIDITY_HOURS:72}

# Rate limiting (capacity per refill window, in minutes)
rate-limit.login.capacity=${RATE_LIMIT_LOGIN_CAPACITY:8}
rate-limit.login.minutes=${RATE_LIMIT_LOGIN_MINUTES:1}
rate-limit.register.capacity=${RATE_LIMIT_REGISTER_CAPACITY:5}
rate-limit.register.minutes=${RATE_LIMIT_REGISTER_MINUTES:5}
rate-limit.password-reset.capacity=${RATE_LIMIT_PASSWORD_RESET_CAPACITY:3}
rate-limit.password-reset.minutes=${RATE_LIMIT_PASSWORD_RESET_MINUTES:5}
rate-limit.admin.capacity=${RATE_LIMIT_ADMIN_CAPACITY:30}
rate-limit.admin.minutes=${RATE_LIMIT_ADMIN_MINUTES:1}
rate-limit.inventory.capacity=${RATE_LIMIT_INVENTORY_CAPACITY:60}
rate-limit.inventory.minutes=${RATE_LIMIT_INVENTORY_MINUTES:1}
rate-limit.procurement.capacity=${RATE_LIMIT_PROCUREMENT_CAPACITY:60}
rate-limit.procurement.minutes=${RATE_LIMIT_PROCUREMENT_MINUTES:1}
rate-limit.users.capacity=${RATE_LIMIT_USERS_CAPACITY:30}
rate-limit.users.minutes=${RATE_LIMIT_USERS_MINUTES:1}
rate-limit.suppliers.capacity=${RATE_LIMIT_SUPPLIERS_CAPACITY:60}
rate-limit.suppliers.minutes=${RATE_LIMIT_SUPPLIERS_MINUTES:1}
rate-limit.warehouses.capacity=${RATE_LIMIT_WAREHOUSES_CAPACITY:60}
rate-limit.warehouses.minutes=${RATE_LIMIT_WAREHOUSES_MINUTES:1}
rate-limit.dashboard.capacity=${RATE_LIMIT_DASHBOARD_CAPACITY:30}
rate-limit.dashboard.minutes=${RATE_LIMIT_DASHBOARD_MINUTES:1}
rate-limit.requisitions.capacity=${RATE_LIMIT_REQUISITIONS_CAPACITY:60}
rate-limit.requisitions.minutes=${RATE_LIMIT_REQUISITIONS_MINUTES:1}
rate-limit.cost-centers.capacity=${RATE_LIMIT_COST_CENTERS_CAPACITY:30}
rate-limit.cost-centers.minutes=${RATE_LIMIT_COST_CENTERS_MINUTES:1}
rate-limit.employees.capacity=${RATE_LIMIT_EMPLOYEES_CAPACITY:30}
rate-limit.employees.minutes=${RATE_LIMIT_EMPLOYEES_MINUTES:1}
rate-limit.reports.capacity=${RATE_LIMIT_REPORTS_CAPACITY:30}
rate-limit.reports.minutes=${RATE_LIMIT_REPORTS_MINUTES:1}
