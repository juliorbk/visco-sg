services:
  postgres:
    image: postgres:16-alpine
    container_name: visco_db_dev
    env_file: .env
    environment:
      POSTGRES_DB: visco_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d visco_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data_dev: